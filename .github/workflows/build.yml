name: Build APK and test backend

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  android-apk:
    # ubuntu-24.04 images ship with the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK to the "apk" branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apkout
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/AKSuperAgent-debug.apk
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add AKSuperAgent-debug.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - uses: actions/upload-artifact@v4
        with:
          name: AKSuperAgent-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
